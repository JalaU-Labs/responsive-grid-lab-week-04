stages:
  - quality
  - test
  - deploy

default:
  image: node:22-bookworm
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - node_modules/
      - .pnpm-store/

before_script:
  - corepack enable
  - corepack prepare pnpm@12 --activate
  - pnpm config set store-dir .pnpm-store

lint:
  stage: quality
  script:
    - pnpm install --frozen-lockfile
    - pnpm lint
    - pnpm format:check

playwright:
  stage: test
  script:
    - pnpm install --frozen-lockfile
    - pnpm exec playwright install --with-deps chromium
    - pnpm test
  artifacts:
    when: always
    paths:
      - playwright-report/
    expire_in: 7 days

pages:
  stage: deploy
  script:
    - pnpm install --frozen-lockfile
    - export VITE_BASE=$(node -e "console.log(new URL(process.env.CI_PAGES_URL).pathname)")
    - pnpm build
    - rm -rf public
    - mv dist public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH